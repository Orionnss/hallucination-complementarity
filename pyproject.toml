[project]
name = "hallucination-complementarity"
version = "0.1.0"
description = "Complementarity study of hallucination detection methods"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "transformers>=4.51",
    "accelerate>=1.0",
    "bitsandbytes>=0.45",
    "datasets>=3.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "umap-learn>=0.5.12",
    "matplotlib>=3.11.1",
    "plotly>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/halluc"]

[tool.ruff]
line-length = 100
